<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مترجم عربي ← تركي</title>
<style>
:root{--bg:#f6f4ef;--fg:#1d1d1b;--mut:#6b6a66;--card:#fff;--bd:#e3e0d8;--ac:#c0392b;--ac2:#0d6b5e}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#f1efe8;--mut:#a09e96;--card:#222220;--bd:#34332f;--ac:#e5594a;--ac2:#3fb8a6}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;min-height:100vh}
main{max-width:520px;margin:0 auto;padding:20px 16px 40px;display:flex;flex-direction:column;gap:16px}
h1{font-size:20px;margin:4px 0 0;text-align:center}
.mic{align-self:center;width:96px;height:96px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:38px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.mic.on{animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.55)}100%{box-shadow:0 0 0 26px rgba(192,57,43,0)}}
#status{text-align:center;color:var(--mut);font-size:15px;min-height:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px}
.lbl{font-size:12px;color:var(--mut);margin-bottom:6px}
textarea{width:100%;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:18px;padding:10px;resize:vertical}
#tr{font-size:22px;line-height:1.5;min-height:34px;direction:ltr;text-align:left;color:var(--ac2);font-weight:600}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);font-size:15px;cursor:pointer}
.btn.main{background:var(--ac2);color:#fff;border:0}
.btn:disabled{opacity:.4}
#hist{display:flex;flex-direction:column;gap:8px}
.h{border-top:1px solid var(--bd);padding-top:8px;font-size:14px}
.h .t{direction:ltr;text-align:left;color:var(--ac2)}
.err{color:var(--ac);text-align:center;font-size:14px}
</style>
</head>
<body>
<main>
  <h1>مترجم صوتي: عربي ← تركي</h1>
  <button class="mic" id="mic" aria-label="ميكروفون">🎤</button>
  <div id="status"></div>
  <div class="card">
    <div class="lbl">اكتب أو اتكلم (ميكروفون الكيبورد 🎤 شغال دايمًا)</div>
    <textarea id="inp" rows="3" placeholder="اكتب أو اتكلم بالعربي…"></textarea>
    <div class="row"><button class="btn main" id="go">ترجم وانطق بالتركي</button></div>
  </div>
  <div class="card">
    <div class="lbl">Türkçe</div><div id="tr"></div>
    <div class="row"><button class="btn" id="play" disabled>🔊 اسمعها تاني</button><button class="btn" id="copy" disabled>نسخ</button></div>
  </div>
  <div id="hist"></div>
  <div class="err" id="err"></div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var mic=$('mic'),st=$('status'),inp=$('inp'),trEl=$('tr'),err=$('err'),play=$('play'),copy=$('copy'),hist=$('hist');
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var rec=null,listening=false,lastTr='',trVoice=null;

  function pickVoice(){
    var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];
    trVoice=vs.find(function(v){return v.lang&&v.lang.toLowerCase().replace('_','-').indexOf('tr')===0})||null;
  }
  if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}

  function speak(t){
    if(!window.speechSynthesis||!t)return;
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(t);
    u.lang='tr-TR';if(trVoice)u.voice=trVoice;u.rate=0.95;
    speechSynthesis.speak(u);
  }

  async function viaGoogle(text){
    var r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=ar&tl=tr&dt=t&q='+encodeURIComponent(text));
    if(!r.ok)throw new Error('g');
    var j=await r.json();
    return j[0].map(function(p){return p[0]}).join('');
  }
  async function viaMyMemory(text){
    var r=await fetch('https://api.mymemory.translated.net/get?langpair=ar|tr&q='+encodeURIComponent(text));
    if(!r.ok)throw new Error('m');
    var j=await r.json();
    return j.responseData.translatedText;
  }
  async function translate(text){
    try{return await viaGoogle(text)}catch(e){return await viaMyMemory(text)}
  }

  async function handle(text){
    err.textContent='';trEl.textContent='';st.textContent='بترجم…';
    try{
      var t=(await translate(text)).trim();
      lastTr=t;trEl.textContent=t;st.textContent='';
      play.disabled=copy.disabled=false;
      speak(t);
      var d=document.createElement('div');d.className='h';
      var a=document.createElement('div');a.textContent=text;
      var b=document.createElement('div');b.className='t';b.textContent=t;
      d.appendChild(a);d.appendChild(b);hist.insertBefore(d,hist.firstChild);
    }catch(e){
      st.textContent='';
      err.textContent='الترجمة فشلت. اتأكد إن النت شغال وجرّب تاني.';
    }
  }

  function start(){
    err.textContent='';
    if(!SR||!window.isSecureContext){
      err.textContent='الميكروفون مش متاح في الملف المحلي. اكتب في المربع واستخدم ميكروفون الكيبورد 🎤.';
      return;
    }
    rec=new SR();rec.lang='ar-EG';rec.interimResults=true;rec.continuous=false;
    var finalText='';
    rec.onstart=function(){listening=true;mic.classList.add('on');st.textContent='بسمعك…'};
    rec.onresult=function(e){
      var s='';finalText='';
      for(var i=0;i<e.results.length;i++){s+=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=e.results[i][0].transcript}
      inp.value=s;
    };
    rec.onerror=function(e){
      if(e.error==='not-allowed'||e.error==='service-not-allowed')err.textContent='الميكروفون مش مسموح. استخدم ميكروفون الكيبورد 🎤 في المربع.';
      else if(e.error==='no-speech')st.textContent='مسمعتش حاجة، جرّب تاني.';
      else if(e.error!=='aborted')err.textContent='مشكلة في التعرّف على الصوت ('+e.error+').';
    };
    rec.onend=function(){
      listening=false;mic.classList.remove('on');
      var txt=(finalText||inp.value||'').trim();
      if(txt&&st.textContent==='بسمعك…')handle(txt);
      else if(st.textContent==='بسمعك…')st.textContent='';
    };
    try{rec.start()}catch(x){}
  }

  mic.addEventListener('click',function(){
    if(window.speechSynthesis)speechSynthesis.cancel();
    if(listening&&rec)rec.stop();else start();
  });
  $('go').addEventListener('click',function(){var v=inp.value.trim();if(v)handle(v)});
  play.addEventListener('click',function(){speak(lastTr)});
  copy.addEventListener('click',function(){
    try{navigator.clipboard.writeText(lastTr);copy.textContent='اتنسخ ✓';setTimeout(function(){copy.textContent='نسخ'},1200)}catch(e){}
  });
})();
</script>
</body>
</html>
